[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-guardrail-gateway"
version = "0.0.1"
description = "A1 Agent Guardrail Gateway — runtime policy proxy (PII redaction + prompt-injection/jailbreak defense + I/O filtering) for the Horizon agent platform, backed by Model Armor + Sensitive Data Protection / DLP."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Ashish Awasthi" }]
keywords = ["guardrail", "model-armor", "dlp", "pii", "prompt-injection", "gcp", "cloud-run", "fastapi"]

# Core deps are framework-light so the service installs and the local profile
# runs without any Google Cloud SDK. Managed-service adapters live in the [gcp] extra.
dependencies = [
  # Shared commons, pinned by tag; no build-time coupling. Public repo, so CI
  # installs it with zero credentials. hex-service-kit: inbound S2S verification (web), the
  # StrEnum kernel base, and the fail-closed bind guard. Pure-stdlib core.
  "hex-service-kit @ git+https://github.com/portable-genai/hex-service-kit@v0.0.6",
  # pii-kit: the shared, versioned jurisdiction PII pattern pack (C4). The local redactor
  # and the offline eval gate read their national-identifier rows, checksum validators and
  # RE2-safe forms from here, so this repo keeps no private copy to drift. Pure stdlib.
  "pii-kit @ git+https://github.com/portable-genai/pii-kit@v0.0.1",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
# Pinned per mid-2026 research. Only needed for the 'gcp' profile.
gcp = [
  "google-cloud-modelarmor>=0.2",
  "google-cloud-dlp>=3.20",
  "google-api-core>=2.19",
]
dev = [
  # Shared commons: the --mode smoke|gate scaffold, report types and the Hrz4
  # promotion-gate client used by eval/run_eval.py. Dev-only: the serving core never imports it,
  # so the framework-light runtime dependency set is unchanged.
  "agent-eval-kit @ git+https://github.com/portable-genai/agent-eval-kit@v0.0.1",
  "pytest>=8.2",
  "httpx>=0.27",
  # Pinned exactly: ruff's formatter output changes between releases, so an unpinned
  # version drifts from CI and fails `ruff format --check`. Bump deliberately.
  "ruff==0.16.3",
  # Floored at the version whose CONFIGURATION this repository now uses. `>=1.10` was not a
  # neutral floor: `follow_untyped_imports` and `untyped_calls_exclude` arrived in 1.14, so a
  # resolution below it would not understand the file it is configured by -- the currency
  # decision's case, where a stale floor silently permits the behaviour just removed.
  "mypy>=2.3.1",
  "types-PyYAML",
]

[project.urls]
Homepage = "https://github.com/portable-genai/agent-guardrail-gateway"

[project.scripts]
guardrail-gateway = "guardrail_gateway.cli.main:app"

# Required for the hex-service-kit / agent-eval-kit git+https pins (direct references).
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/guardrail_gateway"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".agents/skills"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
# S101 (assert) is fine in tests; the Protocol isinstance assert in the container is
# intentional and runs under -O too via the runtime_checkable Protocol semantics.
[tool.ruff.lint.per-file-ignores]
# Tests assert (S101) and embed long, unavoidable dotted adapter paths (E501).
"tests/*" = ["S101", "E501"]
"src/guardrail_gateway/container.py" = ["S101"]
# Presentation/demo scripts narrate long lines and shell out to local subprocesses;
# line length (E501) and subprocess-with-local-args (S603/S607) are fine there.
"scripts/*" = ["E501", "S603", "S607"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: requires live Google Cloud credentials (deselect with -m 'not integration')",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true

# Two settings that exist so mypy's verdict does not depend on WHICH environment it runs in --
# the property the rest of this section already exists to hold.
#
# `untyped_calls_exclude` drops exactly one complaint -- "this callee has no annotations" --
# for the `google` namespace. `disallow_untyped_calls` exists to stop typed code calling OUR
# untyped code; aimed at a third-party release it is a demand no work here can satisfy, and
# proto-plus generates every message `__init__` without annotations. It silences nothing else:
# a wrong attribute and a wrong argument type on the same call are still reported, which was
# proved by planting both.
untyped_calls_exclude = ["google"]

# `follow_untyped_imports` ANALYSES a dependency that ships no `py.typed` instead of resolving
# it to nothing, so it is MORE checking rather than less. Measured, not assumed: a bogus method
# on a `google.cloud.storage` client was reported by nothing before this and is an
# `attr-defined` error after it, and turning it on immediately surfaced a real type confusion
# in the Model Armor adapter that had been invisible in four trees.
#
# SCOPED to `google.*` on purpose. Set globally it also follows the 3.14 standard library,
# where mypy 2.3.1 cannot parse `annotationlib.py` and reports `Invalid syntax` in a CPython
# source file having checked nothing -- found by running the fleet rather than one sample.
[[tool.mypy.overrides]]
module = ["google.*"]
follow_untyped_imports = true

# Following is the right default and the WRONG answer for generated protobuf modules. Their
# source builds every message class at import time through a descriptor builder, so mypy
# reading it reports `Module has no attribute "Timestamp"` for a class that plainly exists --
# a false finding, and one a blocking gate cannot carry. The `types-protobuf` stubs state the
# truth instead, so mypy is pointed back at them here rather than at the builder.
[[tool.mypy.overrides]]
module = ["google.protobuf.*", "google._upb.*"]
follow_untyped_imports = false
