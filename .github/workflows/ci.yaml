name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Dev + test default profile: the SDK-free `local` stack runs end to end with no GCP SDKs.
env:
  GUARDRAIL_PROFILE: local

jobs:
  build:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      # Install only the framework-light core + dev tools. The [gcp] extra is
      # deliberately NOT installed: tests must pass with no Google Cloud SDKs,
      # proving the local profile and the lazy-import discipline.
      - name: Install (no GCP SDKs, locked)
        run: pip install -r requirements-dev.lock && pip install -e . --no-deps

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy
        run: mypy src

      - name: pytest (offline, local profile)
        run: pytest -m 'not integration' -q

      - name: eval gate (offline, local adapters)
        run: python eval/run_eval.py

      - name: demo self-test (live offline stack)
        run: make demo-selftest RUN_PY=python

      - name: bounded portability proof
        run: make portability-demo RUN_PY=python

  terraform:
    name: terraform fmt · validate (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      # No credentials and no backend: `init -backend=false` only downloads providers, so
      # the deploy-time residency / CMEK / perimeter posture is checked on every PR
      # without touching a cloud account.
      - name: terraform fmt
        run: terraform -chdir=infra/terraform fmt -check -recursive
      - name: terraform init (no backend, no credentials)
        run: terraform -chdir=infra/terraform init -backend=false -input=false
      - name: terraform validate
        run: terraform -chdir=infra/terraform validate

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build image
        run: docker build -t agent-guardrail-gateway:ci .

  supply-chain:
    name: dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      # Audit the committed lockfiles so the result matches exactly what CI and the
      # container image install. --no-deps: the locks are fully compiled (every
      # transitive dep pinned), so audit those versions without re-resolving.
      - name: pip-audit (dev + gcp lockfiles)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements-dev.lock --disable-pip --no-deps
          pip-audit -r requirements-gcp.lock --disable-pip --no-deps
